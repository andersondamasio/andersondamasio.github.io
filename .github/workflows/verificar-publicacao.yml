name: verificar-publicacao

on:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Exigir deploy concluido com sucesso
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$CONCLUSION" != "success" ]; then
            echo "Deploy nao concluido: $CONCLUSION. Geracao/commit nao equivalem a publicacao."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Conferir HTML, canonical, RSS, sitemap e revisao esperada
        run: node scripts/verify-deployment.js
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-publica-${{ github.run_id }}
          path: .editorial/deploy-verification.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
