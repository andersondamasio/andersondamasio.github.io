name: verificar-publicacao

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: verificacao-publica-main
  cancel-in-progress: true

jobs:
  verificar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Aguardar Pages da mesma revisao (limite de tentativas)
        run: node scripts/wait-for-pages.js
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ github.sha }}
      - name: Conferir HTML, canonical, RSS, sitemap e revisao esperada
        run: node scripts/verify-deployment.js
        env:
          EXPECTED_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-publica-${{ github.run_id }}
          path: .editorial/deploy-verification.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
