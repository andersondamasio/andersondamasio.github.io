name: SEO Integrity

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: seo-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reservoir-example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: exemplos/reservoir-sampling/global.json
      - name: Compilar e verificar exemplo CSharp
        working-directory: exemplos/reservoir-sampling
        run: dotnet run --configuration Release --verbosity minimal

  seo-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rebuild e auditoria SEO
        run: npm run seo:maintain

      - name: Validar regressao editorial, URLs e verificacao publica
        run: |
          npm run test:humanizer
          npm run test:editorial
          npm run test:seo:recovery
          npm run test:seo:templates
          npm run test:seo:navigation
          npm run test:seo:indexation
          npm run seo:navigation
          npm run test:model:budget

      - name: Garantir que o SEO gerado foi commitado
        run: git diff --exit-code -- . ':(exclude)node_modules/**'
