name: Publicar artigo revisado

on:
  schedule:
    - cron: '20 12 * * 1'
  workflow_dispatch:
    inputs:
      pacote:
        description: Pacote aprovado em dados/editorial/aprovados (vazio usa a fila)
        type: string
        required: false

permissions:
  contents: write
  pages: write

concurrency:
  group: publicacao-editorial-main
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Selecionar proximo pacote aprovado
        id: fila
        env:
          PACOTE: ${{ inputs.pacote }}
        run: npm run article:queue
      - name: Validar protecoes editoriais
        if: steps.fila.outputs.elegivel == 'true'
        run: |
          npm run test:editorial
          npm run test:seo:templates
          npm run test:seo:navigation
          npm run test:seo:indexation
      - name: Conferir pacote e preparar artigo sem chamadas de IA
        if: steps.fila.outputs.elegivel == 'true'
        env:
          PACOTE: ${{ steps.fila.outputs.pacote }}
        run: |
          [[ "$PACOTE" =~ ^dados/editorial/aprovados/[a-f0-9]{64}\.json$ ]] || exit 1
          git ls-files --error-unmatch -- "$PACOTE"
          npm run article:review -- conferir "$PACOTE"
          npm run article:review -- publicar "$PACOTE"
      - name: Rebuild e auditoria antes do commit
        if: steps.fila.outputs.elegivel == 'true'
        run: npm run seo:maintain
      - name: Commitar publicacao validada
        if: steps.fila.outputs.elegivel == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --check
          git commit -m "Publica artigo com revisao editorial registrada"
          git push origin HEAD:main
      - name: Solicitar build do GitHub Pages
        if: steps.fila.outputs.elegivel == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Confirmar build e conteudo publicado
        if: steps.fila.outputs.elegivel == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export EXPECTED_REVISION="$(git rev-parse HEAD)"
          node scripts/wait-for-pages.js
          node scripts/verify-deployment.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-publica-${{ github.run_id }}
          path: .editorial/deploy-verification.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
