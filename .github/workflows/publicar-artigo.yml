name: Publicar artigo revisado

on:
  schedule:
    - cron: '20 12 * * 1'
  workflow_dispatch:
    inputs:
      pacote:
        description: Pacote aprovado em dados/editorial/aprovados (vazio usa a fila)
        type: string
        required: false

permissions:
  contents: write
  pages: write

concurrency:
  group: publicacao-editorial-main
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Consultar fila existente
        id: consulta
        env:
          PACOTE: ${{ inputs.pacote }}
        run: npm run article:queue
      - name: Validar gerador e revisor automatico antes de consumir API
        if: steps.consulta.outputs.elegivel != 'true' && inputs.pacote == ''
        run: npm run test:editorial
      - name: Instalar navegador para extracao de fontes
        if: steps.consulta.outputs.elegivel != 'true' && inputs.pacote == ''
        run: npx puppeteer browsers install chrome
      - name: Gerar e revisar automaticamente quando nao houver pacote
        if: steps.consulta.outputs.elegivel != 'true' && inputs.pacote == ''
        id: automatica
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DRAFT_MODEL: gpt-5.6-terra
          OPENAI_DRAFT_REASONING_EFFORT: medium
          OPENAI_HUMANIZER_MODEL: gpt-5.6-terra
          OPENAI_HUMANIZER_REASONING_EFFORT: low
          OPENAI_REVIEW_MODEL: gpt-5.6-terra
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: npm run article:auto -- gerar
      - name: Selecionar pacote validado para publicacao
        id: fila
        env:
          PACOTE: ${{ steps.automatica.outputs.pacote || steps.consulta.outputs.pacote || inputs.pacote }}
        run: npm run article:queue
      - name: Validar protecoes editoriais
        if: steps.fila.outputs.elegivel == 'true'
        run: |
          npm run test:editorial
          npm run test:seo:templates
          npm run test:seo:navigation
          npm run test:seo:indexation
      - name: Conferir pacote e preparar artigo sem chamadas de IA
        if: steps.fila.outputs.elegivel == 'true'
        env:
          PACOTE: ${{ steps.fila.outputs.pacote }}
        run: |
          [[ "$PACOTE" =~ ^dados/editorial/aprovados/[a-f0-9]{64}\.json$ ]] || exit 1
          test -f "$PACOTE"
          npm run article:review -- conferir "$PACOTE"
          npm run article:review -- publicar "$PACOTE"
      - name: Rebuild e auditoria antes do commit
        if: steps.fila.outputs.elegivel == 'true'
        run: npm run seo:maintain
      - name: Commitar publicacao validada
        if: steps.fila.outputs.elegivel == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --check
          git commit -m "Publica artigo com revisao editorial registrada"
          git push origin HEAD:main
      - name: Solicitar build do GitHub Pages
        if: steps.fila.outputs.elegivel == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Confirmar build e conteudo publicado
        if: steps.fila.outputs.elegivel == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export EXPECTED_REVISION="$(git rev-parse HEAD)"
          node scripts/wait-for-pages.js
          node scripts/verify-deployment.js
      - name: Registrar resultado editorial no resumo
        if: always()
        env:
          RESULTADO: ${{ job.status }}
          PACOTE: ${{ steps.fila.outputs.pacote }}
          ELEGIVEL: ${{ steps.fila.outputs.elegivel }}
        run: |
          printf '## Publicacao editorial\nResultado: %s\nPacote: `%s`\n' "$RESULTADO" "$PACOTE" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ELEGIVEL" == 'true' && "$RESULTADO" == 'success' ]]; then
            printf '\nPublicacao e verificacao online concluidas.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nNenhuma nova publicacao confirmada nesta execucao. Consulte os motivos de retencao ou a cadencia nos passos acima.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nRevisao automatizada nao equivale a aprovacao humana. Erros de fonte, revisao ou auditoria bloqueiam a publicacao.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Preservar rascunhos e relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revisao-editorial-${{ github.run_id }}
          path: .editorial/rascunhos/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-publica-${{ github.run_id }}
          path: .editorial/deploy-verification.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
