name: gerar-e-commitar

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC; toda segunda as 12:00 UTC equivale a 09:00 em Sao Paulo.
    - cron: "0 12 * * 1"

permissions:
  contents: read

concurrency:
  group: gerar-e-commitar
  cancel-in-progress: false

jobs:
  gerar-e-commitar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências do sistema para o Sharp
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Instalar dependências
        run: npm ci

      - name: Validar regras Humanizer
        run: npm run test:humanizer

      - name: Validar protecoes editoriais e modo rascunho
        run: npm run test:editorial

      - name: Validar URLs estaveis e verificacao publica
        run: npm run test:seo:recovery

      - name: Instalar Chromium para Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Gerar conteúdo com ChatGPT
        run: npm run article:draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DRAFT_MODEL: gpt-5.6-terra
          OPENAI_DRAFT_REASONING_EFFORT: medium
          OPENAI_HUMANIZER_MODEL: gpt-5.6-terra
          OPENAI_HUMANIZER_REASONING_EFFORT: low
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Preservar rascunhos retidos para revisao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rascunhos-editoriais-${{ github.run_id }}-${{ github.run_attempt }}
          path: .editorial/rascunhos/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Confirmar que a geracao nao alterou arquivos versionados
        run: git diff --exit-code
