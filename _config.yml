# Repository documentation is not website content. Keep the Jekyll 3 defaults.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - '*.md'
  - '**/*.md'
  - exemplos/reservoir-sampling/bin/
  - exemplos/reservoir-sampling/obj/
  - dados/editorial/arquivados/
  - _assets/
